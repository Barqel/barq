<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barq documentation</title>
    <meta name="description" content="Documentation for the Barq HTTP and WebSocket framework." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="/en/docs/" />
    <script>
      // stands in for `proxy.ts`, which cannot run once the site is exported:
      // the saved choice wins, then `Accept-Language`
      (function () {
        var lang = null;

        try {
          lang = localStorage.getItem('barq-locale');
        } catch {}

        if (lang !== 'ar' && lang !== 'en') {
          lang = (navigator.languages || [navigator.language]).some(function (value) {
            return /^ar\b/i.test(value);
          })
            ? 'ar'
            : 'en';
        }

        location.replace('/' + lang + '/docs/');
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/en/docs/" />
  </head>
  <body>
    <p><a href="/en/docs/">Barq documentation</a></p>
  </body>
</html>
