name: ORM

on:
  push:
    paths:
      - "packages/orm/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/orm.yml"
  pull_request:
    paths:
      - "packages/orm/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/orm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, build, SQLite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/orm
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Biome
        run: bun run check
      - name: Source types
        run: bun run typecheck
      - name: Test types
        run: bun run typecheck:tests
      - name: Unit and SQLite integration tests
        run: bun test
      - name: Build
        run: bun run build

  live-dialects:
    name: Live MySQL and PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/orm
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: barq_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: barq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d barq_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      BARQ_ORM_MYSQL_URL: mysql://root:secret@127.0.0.1:3306/barq_test
      BARQ_ORM_PG_URL: postgres://postgres:secret@127.0.0.1:5432/barq_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Run every test against both live engines
        run: bun test
